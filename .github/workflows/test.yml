# GitHub Actions CI (PR-4b)
#
# 每次 push / PR 自動跑 pytest, 失敗在 PR 頁面顯示紅叉。
# 矩陣: Python 3.10 / 3.12 × Ubuntu / Windows (專案實際環境是 Win, Linux 為了
# 排除作業系統相依問題 — 例如 path 用 / 還是 \ 寫死).
#
# 不裝重型依賴 (PIL / pymupdf / google-genai / f5-tts), 因為 tests/ 全部是
# 純函式測試. 如果之後加 integration test 要走 TestClient + 真 pipeline,
# 再考慮分 jobs 處理。

name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 裝執行測試所需的依賴: pytest + 我們程式碼會 import 的核心 lib.
      # Pillow / fontTools 因 PR-5a (theme) 需要, 還算輕量。
      # 不裝 pymupdf / google-genai / f5-tts 等重型 + 平台相依的東西, 因為
      # 純函式測試用不到, 也避免 Windows runner 卡 wheel build。
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic httpx beautifulsoup4 Pillow fonttools
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest -v
