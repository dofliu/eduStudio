key_metrics: |
  v3.0 平台基礎完成 (PR-1 ~ PR-3e):
  - 5 種 source: exam_pdf / slides_pdf / repo / document / url
  - 3 種 renderer: 黑板 / 簡報原圖 / Forest pptx (Pillow, 0 LibreOffice 依賴)
  - REST API + React UI (port 8000) + 既有 Flask review UI (port 5000)
  - CLI: scripts/submit_job.py 給排程端用

  v3.1 平台合一 完成 (PR-3f ~ PR-3m):
  - PR-3f: Track B 接 YouTube 上傳通道 (per-artifact upload + meta 預填 + 章節時間軸)
  - PR-3g: 考卷 v1 schema 接 React UI (取代 Flask /edit)
  - PR-3h: slides_pdf 升 deck schema, React UI 顯示投影片縮圖
  - PR-3i: Track A redirect (預設 / → :8000/ui/, KEEP_TRACK_A=1 可關)
  - PR-3j: FAILED 狀態可編輯 + retry render
  - PR-3k: Track B 加 PDF multipart 上傳
  - PR-3l: 聲音切換 picker + 試聽 sample
  - PR-3m: 跨 job 影片 Library 頁

  v3.2 基礎建設 完成 (PR-4a ~ PR-4c):
  - PR-4a: 單章 / 單題重 render (省 30+ 分鐘整份重跑)
  - PR-4b: pytest 基底 + GitHub Actions CI (140 tests, 4 組 matrix)
  - PR-4c: per-job structured logging + React UI tail panel

  v3.2 加分項目 完成 (PR-5a ~ PR-5c):
  - PR-5a: Navy pptx 主題 (forest / navy 切換)
  - PR-5b: F5-TTS 中文預切句 (修「處」+「理與應用」mid-word 切錯)
  - PR-5c: 燒字幕進 MP4 選項 (UI checkbox + ffmpeg subtitles filter)

  測試覆蓋: 140 tests (text_utils 22 / deck 25 / youtube 17 / jobs_store 32 /
  voices 13 / pptx_themes 13 / f5_split 13 / hardsub 6)

  Code review (2026-05-09): 4 個 P0 + 4 個 P1, 詳見 docs/CODE_REVIEW.md.
