old_next_milestone_iter_133: "iter 133 完成 — server/runner.py _run_render_phase (PR-3j / PR-4a / PR-4c orchestrator) 補測試覆蓋. _run_render_phase 是 awaiting_review → render → done 主入口 (也供 /approve + schedule_section_render 共用), 從 PR-3a 上線後沒對應直接測試. value-add 全在這層 wrapper: PR-3j 進入時 store.update(state=RENDERING, error=None) 把 FAILED retry 留下的 stale error 清掉 (不清會讓成功後 record.error 仍掛上次失敗訊息, UI 誤判又紅) / PR-4a stage_name = 'render-section-{section_id}' if section_id else 'render' (UI / log filter 分得出哪一章在跑) / PR-4c own_log gate — schedule_section_render 進來時 current_job_id 還沒 set 自己 attach log file, run_job 已 attach 過則不重 attach (避免 handler 重複 + double-write log.jsonl 每行兩次) / 例外吞 _run_render 任一 raise → state FAILED + error='render 失敗: {msg}' + _end_stage_fail, **不該** propagate 出 task 讓 asyncio 噴未捕捉錯誤 / 成功 refresh_artifacts → state DONE + error=None (清掉之前 retry) + output_dir='jobs/{id}/artifacts' forward slash / finally own_log=True 才 reset contextvar + detach (重複 detach 不安全, FileHandler 累積 FD 洩漏). 任何 refactor 動 state 字串 / 例外傳播 / stage_name 模板 / own_log 條件就直接上線, 跟 iter 111-132 同思路 (route / helper safety lock). TestSuccessPath 6: state PENDING→DONE / output_dir = 'jobs/{job_id}/artifacts' 鎖 forward slash (前端 / YT description 拼 URL, 反斜線會 escape 亂) / stale error 清 (PR-3j) — 起 FAILED+error='上次 ffmpeg 炸' 進來, mid-call snapshot 證明 _run_render 看到 state=RENDERING + error=None, done 後仍 None / done 二次清 error 雙閘 (entry + done 兩段都該 set error=None, 鎖不被改成只 set state) / stage[0] name='render' state='done' error=None / _run_render 透傳 (store / rec.id / section_id=None default). TestFailurePath 4: RuntimeError caught 不 propagate + state=FAILED / error='render 失敗: {orig msg}' 前綴鎖 (debug grep + UI badge 依賴格式, 不被偷改前綴或 truncate) / ValueError 也吞 (鎖 except Exception 範圍不被改成 except RuntimeError 只擋特定型別) / stage[-1] state='failed' + stage.error 原 msg (不被 'render 失敗' prefix 污染 — _end_stage_fail 收 str(e) 而非 record.error). TestStageName 3: section_id=None → 'render' / section_id='q1' → 'render-section-q1' (鎖 f-string 模板不被改成 'render-{q1}' / 'section-q1' 變體, UI 解析依此前綴) / section_id 該以 kwarg 透傳 _run_render (不被改 positional / 拿掉). TestLoggerDispatch 3: 整份路徑 caplog 含 'render 開始 (整份)' + 'render 完成' (INFO level) / section 路徑 caplog 含 'section_id=q1' + 嚴格排除 '(整份)' (防被合併成同一條訊息) / 例外路徑 caplog ERROR level 含 'render 失敗' (logger.exception). TestOwnLogGate 4: contextvar 預設 None → attach 該被叫一次 + log_path = jobs/<id>/log.jsonl + finally detach 一次 / contextvar 已 set 同 job_id (run_job 路徑) → 不該 attach 不該 detach (run_job 那層 finally 自己 detach) / contextvar set 不同 job_id (理論不該發生, 防呆) → own_log=True 仍 attach (鎖條件是 != job_id 不被改 is None) / _run_render raise → 仍走 finally → detach (失敗 job 累積 FileHandler 不 close FD 洩漏). 策略 = monkeypatch server.runner._run_render 成 async stub, 在 stub 內 snapshot store.get(job_id) 證明 entry 時 error 已被清; monkeypatch attach_job_log / detach_job_log 計次驗 own_log gate. 不真跑渲染 / ffmpeg / TTS. 0 production code 改動 (純測試). 1560 → 1580 tests (+20). 下一輪可推: 其他 runner orchestrator 安全鎖 (_run_render_inner schema dispatch / run_job 主流程 ingest→awaiting_review→render 串接 / schedule_job/schedule_render/schedule_section_render 三 entry) / E2-6 / E1-4 UI 元件 / E2-2 (需用戶決議 Gemini SVG)."
