<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Beam element -->
  <rect x="40" y="50" width="176" height="16" stroke="#1e3a2e" stroke-width="3" fill="#ffd96b"/>
  
  <!-- Diagram X-axis (line representing the beam's length for the diagram) -->
  <line x1="40" y1="180" x2="216" y2="180" stroke="#1e3a2e" stroke-width="3"/>
  
  <!-- Shear Diagram Shape (representing a typical V-x diagram with positive and negative shear) -->
  <path d="M 40 180 L 40 130 L 120 130 L 120 230 L 216 230 L 216 180 Z" 
        stroke="#1e3a2e" stroke-width="3" fill="#ffd96b"/>
  
  <!-- "V" symbol to denote Shear Force, placed centrally on the diagram -->
  <text x="128" y="160" text-anchor="middle" font-size="30" font-family="sans-serif" fill="#1e3a2e">V</text>
</svg>