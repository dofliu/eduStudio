<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>S4 視覺站</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#070d17}
body{font-family:"Noto Sans CJK TC","Noto Sans TC",sans-serif;color:#e8eef7;position:relative}
/* ── 背景:深海底 + 極光暈 + 暗角 ── */
.bg{position:absolute;inset:0;background:
 radial-gradient(1200px 800px at 24% 18%,rgba(45,212,191,.14),transparent 62%),
 radial-gradient(1100px 760px at 78% 82%,rgba(139,92,246,.15),transparent 60%),
 radial-gradient(900px 620px at 82% 12%,rgba(251,191,36,.06),transparent 60%),
 linear-gradient(160deg,#0d1b2e 0%,#070d17 58%,#05070d 100%)}
.aur{position:absolute;width:1500px;height:1500px;border-radius:50%;filter:blur(90px);opacity:.5;mix-blend-mode:screen}
.aur.a{background:radial-gradient(circle,rgba(45,212,191,.32),transparent 62%);left:-460px;top:-560px;animation:drift1 22s ease-in-out infinite alternate}
.aur.b{background:radial-gradient(circle,rgba(139,92,246,.30),transparent 62%);right:-520px;bottom:-620px;animation:drift2 26s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(150px,90px) scale(1.12)}}
@keyframes drift2{to{transform:translate(-130px,-80px) scale(1.08)}}
.vig{position:absolute;inset:0;background:radial-gradient(1600px 1000px at 50% 46%,transparent 58%,rgba(0,0,0,.5) 100%);pointer-events:none}
.grid{position:absolute;inset:0;opacity:.05;background-image:linear-gradient(rgba(232,238,247,.5) 1px,transparent 1px),linear-gradient(90deg,rgba(232,238,247,.5) 1px,transparent 1px);background-size:64px 64px}
/* ── 攝影機慢推 ── */
.stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:cam var(--dur,7s) ease-in-out both}
@keyframes cam{from{transform:scale(1)}to{transform:scale(1.055)}}
/* ── 字體系統 ── */
.kicker{font-size:30px;font-weight:700;letter-spacing:.55em;text-indent:.55em;color:#2dd4bf;text-transform:uppercase}
.h1{font-size:112px;font-weight:900;line-height:1.14;text-align:center;letter-spacing:.01em;
 background:linear-gradient(100deg,#f4f8ff 20%,#9be8db 50%,#c4b5fd 80%);-webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 8px 40px rgba(45,212,191,.18))}
.sub{font-size:40px;font-weight:400;color:rgba(232,238,247,.78);text-align:center;line-height:1.6}
.accent{color:#2dd4bf;font-weight:700}
/* ── 元件 ── */
.chip{display:inline-flex;align-items:center;gap:16px;padding:20px 38px;border-radius:999px;font-size:36px;font-weight:700;
 background:rgba(20,32,52,.82);border:1.5px solid rgba(150,200,255,.22);box-shadow:0 14px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.07)}
.card{background:linear-gradient(165deg,rgba(24,38,62,.92),rgba(12,20,36,.94));border:1.5px solid rgba(150,200,255,.20);
 border-radius:26px;box-shadow:0 30px 80px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.08)}
.badge{display:inline-block;padding:12px 26px;border-radius:12px;font-size:28px;font-weight:700;
 background:rgba(45,212,191,.14);border:1.5px solid rgba(45,212,191,.45);color:#7ff0df}
/* ── 進場動畫 ── */
.in{opacity:0;animation:rise 1s cubic-bezier(.16,1,.3,1) both;animation-delay:var(--d,0s)}
@keyframes rise{from{opacity:0;transform:translateY(56px)}to{opacity:1;transform:none}}
.pop{opacity:0;animation:pop .8s cubic-bezier(.2,1.4,.35,1) both;animation-delay:var(--d,0s)}
@keyframes pop{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:scale(1)}}
.glow{animation:glow 2.6s ease-in-out infinite}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 18px rgba(45,212,191,.25))}50%{filter:drop-shadow(0 0 42px rgba(45,212,191,.55))}}

.stage{--dur:7s}

.head{position:absolute;top:96px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:24px}
.h1{font-size:92px}
.deckwrap{position:absolute;left:50%;top:57%;transform:translate(-50%,-50%);width:1560px;height:560px;perspective:1600px}
.mock{position:absolute;top:50%;left:50%;border-radius:20px;overflow:hidden;
 box-shadow:0 40px 90px rgba(0,0,0,.6);opacity:0;animation:fan 1.1s cubic-bezier(.16,1,.3,1) both;animation-delay:var(--d)}
@keyframes fan{from{opacity:0;transform:translate(-50%,-40%) rotateY(0) rotateZ(0) scale(.7)}
 to{opacity:1;transform:translate(calc(-50% + var(--x)),-50%) rotateY(var(--ry)) rotateZ(var(--rz)) scale(1)}}
.slide{width:760px;height:428px;--x:0px;--ry:0deg;--rz:0deg;background:linear-gradient(150deg,#132b46,#0d1d33);border:1.5px solid rgba(150,200,255,.3)}
.slide .bar{height:86px;background:linear-gradient(90deg,#2dd4bf,#38bdf8);display:flex;align-items:center;padding:0 34px;font-size:34px;font-weight:900;color:#04222b}
.slide .row{margin:26px 34px 0;height:26px;border-radius:7px;background:rgba(200,225,255,.22)}
.slide .row.s{width:62%}.slide .row.m{width:80%}
.slide .img{position:absolute;right:34px;bottom:30px;width:250px;height:160px;border-radius:12px;
 background:linear-gradient(140deg,#8b5cf6,#38bdf8);opacity:0;animation:pop .7s 2.5s both;box-shadow:0 0 40px rgba(139,92,246,.5)}
.slide .img::after{content:"AI 補圖";position:absolute;inset:auto 10px 8px auto;font-size:22px;font-weight:700;color:rgba(255,255,255,.9)}
.poster{width:330px;height:470px;--x:-600px;--ry:14deg;--rz:-5deg;background:linear-gradient(165deg,#7c3aed,#312e81);border:1.5px solid rgba(196,181,253,.4);
 display:flex;flex-direction:column;justify-content:flex-end;padding:26px;font-size:34px;font-weight:900}
.cardq{width:400px;height:400px;--x:600px;--ry:-14deg;--rz:5deg;background:linear-gradient(150deg,#0f766e,#134e4a);border:1.5px solid rgba(94,234,212,.4);
 display:flex;align-items:center;justify-content:center;font-size:120px}
.swatches{position:absolute;bottom:104px;left:50%;transform:translateX(-50%);display:flex;gap:14px}
.sw{width:52px;height:52px;border-radius:12px;opacity:0;animation:pop .5s both;animation-delay:var(--d);border:2px solid rgba(255,255,255,.25)}
.caption{position:absolute;bottom:44px;left:0;right:0;text-align:center;font-size:32px;color:rgba(232,238,247,.7)}
</style></head>
<body>
<div class="bg"></div><div class="aur a"></div><div class="aur b"></div><div class="grid"></div>

<div class="stage" style="z-index:2">

<div class="head">
 <div class="kicker in" style="--d:.1s">視覺工作站</div>
 <div class="h1 in" style="--d:.3s">一句主題 → 簡報 · 圖卡 · 海報</div>
</div>
<div class="deckwrap">
 <div class="mock poster" style="--d:1.5s">風力發電<br>入門海報</div>
 <div class="mock cardq" style="--d:1.75s">⚙️</div>
 <div class="mock slide" style="--d:1.0s">
   <div class="bar">材料力學 · 第 3 章 彎曲應力</div>
   <div class="row m"></div><div class="row"></div><div class="row s"></div>
   <div class="img"></div>
 </div>
</div>
<div class="swatches">
 <div class="sw" style="background:#2dd4bf;--d:3.3s"></div><div class="sw" style="background:#38bdf8;--d:3.4s"></div>
 <div class="sw" style="background:#8b5cf6;--d:3.5s"></div><div class="sw" style="background:#f472b6;--d:3.6s"></div>
 <div class="sw" style="background:#fbbf24;--d:3.7s"></div><div class="sw" style="background:#34d399;--d:3.8s"></div>
 <div class="sw" style="background:#e8eef7;--d:3.9s"></div><div class="sw" style="background:#64748b;--d:4.0s"></div>
</div>
<div class="caption in" style="--d:4.3s">16 種主題 · 受眾/語氣引導 · <span class="accent">PPTX 一鍵匯出</span> · 缺圖簡報自動補圖(原文字可編輯)</div>

</div>
<div class="vig" style="z-index:3"></div>

</body></html>
