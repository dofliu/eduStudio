# ideate 自動企劃設定範本 (v4 階段 2 B)
#
# 第一次設定:
#   cp ideate_config.example.yaml ideate_config.yaml
#   # 編輯 watched_folders 改成你的教材資料夾
#
# 跑法:
#   * 手動: 在 UI /proposals 頁按「📂 掃資料夾」, 或命令列:
#       python scripts/run_ideate.py auto D:/path/to/folder
#   * 自動: 啟動 server 時設 IDEATE_AUTO_SCAN=1, 每 interval_hours 小時自動跑
#
# ideate_config.yaml 已 gitignored (含個人路徑), 不會誤 commit。

# 監看資料夾 — 可放多個, 每個資料夾可標 source_type 或留 "auto" 自動判斷
watched_folders:
  - path: "D:/Teaching/Materials/材料力學"
    source_type: auto         # auto = Gemini Vision 看每份 PDF 自動判斷
                              # 或強制: exam_pdf / slides_pdf / document
    scan_window_days: 30      # 只看 N 天內修改的檔

  # 多個資料夾可以這樣加:
  # - path: "D:/Teaching/Exams/2026"
  #   source_type: exam_pdf   # 強制當考題, 跳過 detect 省 API quota
  #   scan_window_days: 60

  # - path: "D:/Articles"
  #   source_type: document
  #   scan_window_days: 14

# Gemini 模型 (跟 pipeline 用同一把 GEMINI_API_KEY)
llm_model: "gemini-2.5-flash"

# 每份 PDF 最多產幾個提案 (上限)
max_proposals_per_file: 3

# enabled=false 時 ideate 完全不跑 (CLI + scheduler + UI 都尊重)
enabled: true

# 自動排程:伺服器啟動時每隔 N 小時自動跑 ideate
# 僅在 server 程序在跑 + 設了 IDEATE_AUTO_SCAN=1 環境變數才生效
# 設 0 關掉自動排程 (但 UI 按鈕 + CLI 仍可手動觸發)
auto_scan_interval_hours: 6
